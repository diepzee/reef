[project]
name = "rif"
version = "0.1.0"
description = "Shared, living memory for people and their AI assistants"
readme = "README.md"
authors = [
    { name = "WOUTER DURNEZ", email = "wouter.durnez@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.64",
    "fastmcp>=2",
    "httpx>=0.28.1",
    "logfire[asyncpg,httpx,starlette]>=4.40.0",
    "piccolo>=1.36.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["clients/python"]

[tool.uv.sources]
reefcli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reefcli",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "clients/python/src"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
