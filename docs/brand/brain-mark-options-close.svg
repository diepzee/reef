<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Subtle brain-inspired variations of the original reef mark</title>
  <desc id="desc">The current traced fan coral beside three minimally changed variations that suggest a brain while preserving its silhouette.</desc>

  <defs>
    <linearGradient id="coral-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="16">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>

    <symbol id="current" viewBox="0 0 64 64">
      <image x="0" y="0" width="64" height="64" xlink:href="data:image/svg+xml;base64,"/>
    </symbol>

    <!-- The existing deep opening becomes a brain cleft by joining only its bottom edge. -->
    <symbol id="joined-cleft" viewBox="0 0 64 64">
      <image x="0" y="0" width="64" height="64" xlink:href="data:image/svg+xml;base64,"/>
      <path d="M34.2 50.2C34.8 47.8 36.2 46.4 38.7 46V50.2H34.2Z" fill="url(#coral-gradient)"/>
    </symbol>

    <!-- Same silhouette and bridge, with two short extensions of existing voids. -->
    <symbol id="soft-folds" viewBox="0 0 64 64">
      <image x="0" y="0" width="64" height="64" xlink:href="data:image/svg+xml;base64,"/>
      <path d="M34.2 50.2C34.8 47.8 36.2 46.4 38.7 46V50.2H34.2Z" fill="url(#coral-gradient)"/>
      <g fill="none" stroke="#e7f9f4" stroke-width="1.55" stroke-linecap="round">
        <path d="M23.4 30.5C26.1 32.2 27.6 34.7 27.4 37.8"/>
        <path d="M43.6 36.4C41.2 37.7 39.8 40.2 39.5 43.2"/>
      </g>
    </symbol>

    <!-- The original again, with one more restrained cortical fold. -->
    <symbol id="three-folds" viewBox="0 0 64 64">
      <image x="0" y="0" width="64" height="64" xlink:href="data:image/svg+xml;base64,"/>
      <path d="M34.2 50.2C34.8 47.8 36.2 46.4 38.7 46V50.2H34.2Z" fill="url(#coral-gradient)"/>
      <g fill="none" stroke="#e7f9f4" stroke-width="1.6" stroke-linecap="round">
        <path d="M23.4 30.5C26.1 32.2 27.6 34.7 27.4 37.8"/>
        <path d="M43.6 36.4C41.2 37.7 39.8 40.2 39.5 43.2"/>
        <path d="M31.5 29.3C31.2 33 32.1 35.5 34 37.3"/>
      </g>
    </symbol>

    <filter id="shadow" x="-12%" y="-12%" width="124%" height="138%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f4c45" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="610" fill="#f5fbf9"/>
  <circle cx="1120" cy="-20" r="185" fill="#ddf7f0"/>
  <circle cx="15" cy="610" r="125" fill="#e2f8f2"/>

  <text x="64" y="66" fill="#123b36" font-family="Arial, sans-serif" font-size="34" font-weight="700">Much closer to the original</text>
  <text x="64" y="102" fill="#52726e" font-family="Arial, sans-serif" font-size="17">The traced coral stays intact. Each option changes only the cleft, a few folds, or the branch tips.</text>

  <g transform="translate(64 144)">
    <rect width="252" height="364" rx="25" fill="white" filter="url(#shadow)"/>
    <use xlink:href="#current" x="38" y="32" width="176" height="176"/>
    <text x="28" y="247" fill="#78908d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">REFERENCE</text>
    <text x="28" y="277" fill="#173e39" font-family="Arial, sans-serif" font-size="23" font-weight="700">Current mark</text>
    <text x="28" y="306" fill="#607b77" font-family="Arial, sans-serif" font-size="14">The approved traced coral,</text>
    <text x="28" y="327" fill="#607b77" font-family="Arial, sans-serif" font-size="14">completely untouched.</text>
    <use xlink:href="#current" x="28" y="337" width="22" height="22"/>
  </g>

  <g transform="translate(338 144)">
    <rect width="252" height="364" rx="25" fill="white" filter="url(#shadow)"/>
    <use xlink:href="#joined-cleft" x="38" y="32" width="176" height="176"/>
    <text x="28" y="247" fill="#0d9488" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">A · MOST SUBTLE</text>
    <text x="28" y="277" fill="#173e39" font-family="Arial, sans-serif" font-size="23" font-weight="700">Joined Cleft</text>
    <text x="28" y="306" fill="#607b77" font-family="Arial, sans-serif" font-size="14">One tiny bridge turns the</text>
    <text x="28" y="327" fill="#607b77" font-family="Arial, sans-serif" font-size="14">natural opening into a cleft.</text>
    <use xlink:href="#joined-cleft" x="28" y="337" width="22" height="22"/>
  </g>

  <g transform="translate(612 144)">
    <rect width="252" height="364" rx="25" fill="white" filter="url(#shadow)"/>
    <use xlink:href="#soft-folds" x="38" y="32" width="176" height="176"/>
    <text x="28" y="247" fill="#0d9488" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">B · BALANCED</text>
    <text x="28" y="277" fill="#173e39" font-family="Arial, sans-serif" font-size="23" font-weight="700">Soft Folds</text>
    <text x="28" y="306" fill="#607b77" font-family="Arial, sans-serif" font-size="14">The same outline, with two</text>
    <text x="28" y="327" fill="#607b77" font-family="Arial, sans-serif" font-size="14">short cortex-like grooves.</text>
    <use xlink:href="#soft-folds" x="28" y="337" width="22" height="22"/>
  </g>

  <g transform="translate(886 144)">
    <rect width="252" height="364" rx="25" fill="white" filter="url(#shadow)"/>
    <use xlink:href="#three-folds" x="38" y="32" width="176" height="176"/>
    <text x="28" y="247" fill="#0d9488" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">C · BRAINIEST</text>
    <text x="28" y="277" fill="#173e39" font-family="Arial, sans-serif" font-size="23" font-weight="700">Cortical Echo</text>
    <text x="28" y="306" fill="#607b77" font-family="Arial, sans-serif" font-size="14">Original silhouette, with one</text>
    <text x="28" y="327" fill="#607b77" font-family="Arial, sans-serif" font-size="14">additional central fold.</text>
    <use xlink:href="#three-folds" x="28" y="337" width="22" height="22"/>
  </g>

  <text x="600" y="564" text-anchor="middle" fill="#6b8581" font-family="Arial, sans-serif" font-size="14">Original geometry retained · concept sheet only · no production asset replaced</text>
</svg>
