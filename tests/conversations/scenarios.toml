# Scripted conversations with a made-up person, Lode Vanhecke of Mechelen.
#
# Every fact comes from src/reef/testaccount/person/. Messages are written
# the way Lode types: Dutch or English, short, no mention of tools. A
# confirmation is Lode's next message. Reads come first, then writes: each
# write starts from a reset, and its [[scenario.after]] checks read the
# memory afterwards.
#
# Fields: id, kind ("read" or "write"), messages, tools_required (a list inside
# is a set of alternatives: one of them is enough),
# tools_forbidden, facts (every one must be in the answer; a list inside is a
# set of ways to write it), engrams (paths the answer must name), needs
# ("files", "file_text"), connector (only search and fetch are offered).
# review = true makes a right answer a review, for a person to read.
# answer_must_not is a list of regular expressions the answer must not match.
# After checks: ref, contains (same shape as facts), absent (a list of texts
# that must be gone, or true when the whole engram must be gone), replaced_by
# (refs that must be named as replacements on the old engram).

# --- reads ---------------------------------------------------------------------

[[scenario]]
id = "dentist-moved"
kind = "read"
messages = ["Wanneer is mijn volgende tandartsafspraak?"]
tools_required = ["load_index", "recall"]
tools_forbidden = ["write", "correct", "remember", "log", "forget"]
facts = ["3 december", ["9:15", "09:15", "9.15", "9u15"]]

