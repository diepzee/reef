# Scripted conversations with a made-up person, Lode Vanhecke of Mechelen.
#
# Every fact comes from src/reef/testaccount/person/. Messages are written
# the way Lode types: Dutch or English, short, no mention of tools. A
# confirmation is Lode's next message. Reads come first, then writes: each
# write starts from a reset, and its [[scenario.after]] checks read the
# memory afterwards.
#
# Fields: id, kind ("read" or "write"), messages, tools_required,
# tools_forbidden, facts (every one must be in the answer; a list inside is a
# set of ways to write it), engrams (paths the answer must name), needs
# ("files", "file_text"), connector (only search and fetch are offered).
# After checks: ref, contains (same shape as facts), absent (a list of texts
# that must be gone, or true when the whole engram must be gone).

# --- reads ---------------------------------------------------------------------

