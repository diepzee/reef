# What has to be true before anything reaches main -- and therefore before
# it reaches production, since Railway deploys every push to main.
#
# The database is brought up with the repo's own docker-compose rather than
# an Actions `services:` container. That is deliberate: the suite's whole
# claim to honesty rests on *which role* it runs as. The app role must be an
# ordinary, non-superuser, non-BYPASSRLS role, and a second non-owner role
# has to exist for the privilege tests -- see the long header in
# docker/initdb/01-create-app-role-and-databases.sql, which records the five
# days production ran as a superuser with every policy inert while the tests
# still passed. Those roles are created by that init script, which only runs
# on a fresh volume; `services:` containers start before the repo is checked
# out and so cannot mount it. Using compose keeps CI, dev, and test on one
# definition of the cluster instead of two that can drift apart.

name: CI

on:
  # Plain pull_request: default types only (opened, synchronize, reopened).
  # The changelog job used to live here and needed labeled/unlabeled for its
  # no-changelog escape hatch -- but that made every label change cancel
  # this workflow's in-flight run (concurrency below is keyed on
  # github.ref with cancel-in-progress true for PR events), and gating
  # backend/frontend with an if: to skip on label events would report
  # "skipped" on a required check, which branch protection counts as
  # passing -- silently turning a red PR green. See changelog.yml, which
  # now owns that job and its own label-triggered runs.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # On a pull request, a newer push makes the in-flight run irrelevant --
  # only the tip is going to be merged. On main it is the opposite: every
  # commit there is deployed, so cancelling means a commit reaches
  # production with its run showing "cancelled" and nobody having seen
  # whether it passed. That already happened once, to the commit that
  # added this file. Merges land in bursts; the runs have to keep up.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: docker compose up -d db

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Wait for the cluster to finish bootstrapping
        # The app role and rif_test are created by the init script, so
        # connecting as rif to rif_test is the real readiness condition --
        # an open port is not, and pg_isready would pass too early.
        run: |
          for _ in $(seq 1 60); do
            if PGPASSWORD=rif psql -h localhost -p 5433 -U rif -d rif_test \
                 -c 'select 1' >/dev/null 2>&1; then
              echo "cluster ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres never became ready. Container logs:"
          docker compose logs db
          exit 1

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend (bun test + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: unpinned CI took whatever bun shipped last, and on
          # 17 Aug 2026 that intermittently core-dumped (SIGABRT) inside
          # PageView.test.tsx on two unrelated PRs. 1.3.3 is the version
          # the suite is developed against locally. Bump deliberately,
          # with a green run as evidence, not by default.
          bun-version: 1.3.3

      - name: Install
        # Frozen: CI proves the lockfile in the repo resolves, rather than
        # quietly resolving something else and passing.
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Build
        run: bun run build

  # The Changelog fragment check used to be a job here. It now lives in its
  # own workflow, changelog.yml -- it has to re-run on label add/remove for
  # the no-changelog escape hatch, and doing that inside this workflow either
  # cancelled the in-flight test run (concurrency below) or, if gated with an
  # if: to dodge that, would report "skipped" on a required check, which
  # branch protection counts as passing. See changelog.yml's header.

  # A no-write semantic-release run, so a broken .releaserc.json or an
  # unparseable commit history fails in review rather than on main -- where it
  # would sit between a merge and a production deploy.
  #
  # Its own job, mirroring `changelog` in changelog.yml, rather than a step
  # in `backend`. semantic-release reads the full tag history, and this
  # action runs against the job's existing checkout rather than cloning its
  # own -- so as a step in `backend` it would need fetch-depth: 0 there,
  # deepening the clone on every push to main as well, for a step that only
  # ever runs on pull requests.
  release-dry-run:
    name: Release dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # semantic-release CORE verifies it could push by running `git push
    # --dry-run` before it analyses anything -- even in dry_run mode, and
    # even with the analysis-only plugin list. With the default read-only
    # token that fails EGITNOPERMISSION, so the job needs write here even
    # though it writes nothing. A fork's PR gets a read-only token
    # regardless of this line, so it grants nothing to a stranger.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads full tag and commit history
          # The PR branch itself, not the merge ref. A pull_request checkout
          # lands on refs/pull/N/merge, which matches neither .releaserc.json's
          # branches nor the `branches` override below -- semantic-release then
          # says "a new version won't be published" and exits green, having
          # analysed nothing. Checking out the head branch is what makes the
          # override bite.
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the release job, so both resolve alike

      - name: Semantic-release dry run
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          # Both overrides are load-bearing, not decoration. semantic-release
          # refuses to do anything on a pull-request event and returns before
          # it ever analyses a commit -- ci: false lifts that refusal. Even
          # with that, it still checks the current ref against `branches` in
          # .releaserc.json (["main"]) and no-ops on a mismatch, since a PR's
          # ref is never "main" -- branches: github.head_ref overrides that
          # check to the PR's own branch. Without both, this job goes green
          # having proved only that .releaserc.json parses, not that commit
          # analysis or version computation actually ran. On the first real
          # PR after this change, check the log for a computed *next
          # version* (e.g. "The next release version is X.Y.Z"), not a "This
          # test run was triggered by a pull request... won't publish" line
          # -- that line is the old, unproven-negative behaviour.
          ci: false
          branches: ${{ github.head_ref }}
          # semantic-release reads the branch from GITHUB_REF via env-ci, not
          # from the checkout -- and on a pull_request that is
          # refs/pull/N/merge, which matches nothing. unset_gha_env clears the
          # GitHub Actions variables so it falls back to the checked-out git
          # branch, which `ref` above pins to the PR's head.
          unset_gha_env: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tag the release the moment its PR merges. release-pr.yml prepares
  # every release as a squash-merged "chore(release): X.Y.Z" commit; this
  # job recognises that commit on main, pushes the vX.Y.Z tag, and turns
  # the commit body (the release notes, carried through the squash) into
  # the GitHub release. Gated on backend and frontend so a broken build
  # never gets a tag -- the same run that tests the merge does the tagging.
  #
  # The tag is pushed with the bot's app token. No bypass is involved:
  # rulesets on main govern refs/heads/main, and this pushes only a tag.
  tag:
    name: 🔖 Release
    needs: [backend, frontend]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.cut.outputs.published }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}
      - name: 🔖 Tag and create the GitHub release
        id: cut
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          version=$(printf '%s' "$subject" | sed -nE 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p')
          if [ -z "$version" ]; then
            echo "::error::Could not parse a full semver out of '$subject'."
            exit 1
          fi

          # The subject alone is not proof this is a real release commit --
          # any write-access user can self-merge "chore(release): 9.9.9" and
          # otherwise mint a tag, a release, and a publish attempt. Cross-
          # check it against the version release-pr.yml actually stamped
          # into the manifest. (An author-identity check was considered and
          # rejected: it would break legitimate manual recovery commits.)
          stamped=$(sed -nE 's/^version = "([^"]+)"$/\1/p' pyproject.toml | head -1)
          if [ "$version" != "$stamped" ]; then
            echo "::error::Subject says $version but pyproject.toml is stamped $stamped -- this is not a release commit built by release-pr.yml. Refusing to tag."
            exit 1
          fi

          # The trailer proves which base commit-analysis actually ran
          # against. If main moved between release-pr.yml's build and this
          # merge, the squash commit's parent will not match it -- commits
          # in that window were never analysed for this release, and their
          # notes silently would not appear. Refuse rather than tag a release
          # that dropped commits.
          release_base=$(git log -1 --format=%b | sed -nE 's/^Release-base: ([0-9a-f]{40})$/\1/p')
          parent=$(git rev-parse HEAD^)
          if [ -z "$release_base" ]; then
            echo "::error::The release commit carries no Release-base trailer -- it was not built by release-pr.yml. Refusing to tag."
            exit 1
          fi
          if [ "$release_base" != "$parent" ]; then
            echo "::error::Stale release merge: the release PR was built on $release_base but merged onto $parent. Commits between them were never analysed. Do not re-run; close nothing -- the bot will refresh a corrected release PR on the next push to main (or trigger the Release PR workflow manually), then squash-merge that."
            exit 1
          fi

          # Idempotency is keyed on the GitHub release, not the tag: a
          # re-run after a tag-only partial failure (tag pushed, release
          # creation failed) must finish the job, not no-op green while
          # never actually publishing a release.
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version release already exists; nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote --tags origin "refs/tags/v$version" | grep -q .; then
            git tag "v$version"
            git push origin "v$version"
          else
            echo "Tag v$version exists but the release does not -- completing the release."
          fi
          # Trailers are for machines, not readers of a GitHub release --
          # strip them before they land in the release body.
          git log -1 --format=%b | sed -E '/^(Co-authored-by|Release-base):/d' > /tmp/notes.md
          gh release create "v$version" --title "v$version" --notes-file /tmp/notes.md
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Publish only what actually changed. Both clients carry the repo-wide
  # version, so a server-only release would otherwise push two byte-identical
  # packages to two public registries and burn a version number saying
  # nothing. Client versions therefore skip -- 0.3.0 to 0.7.0 -- and every
  # number on a registry corresponds to a real change to that client.
  #
  # The diff ends at HEAD~1 because HEAD is the release commit, produced by
  # squash-merging the bot's release PR, which touches every manifest and
  # would make the gate always true. That holds only because the release PR
  # is squash-merged as exactly one commit -- the ruleset only allows squash
  # merges, so a merge- or rebase-commit strategy can't land here -- and the
  # failure is NOT one-directional: zero commits would skip wrongly, but
  # *two* would leave a release commit inside the diff range and publish
  # both clients on every release -- the expensive direction. So the
  # assumption is asserted below rather than trusted, and every branch logs
  # what it decided.
  publish:
    name: 📦 Publish changed clients
    needs: tag
    if: needs.tag.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag itself, not main. Checking out main here would race any
          # merge that lands between the tag job finishing and this step
          # running: a moved main puts the next release commit's manifest
          # stamps inside HEAD~1's range too, and the assertion below can't
          # catch it since it only counts chore(release) subjects, not
          # which commit HEAD actually is. The tag is immutable the moment
          # it's pushed, so pinning to it makes this checkout race-free.
          ref: v${{ needs.tag.outputs.version }}
          fetch-depth: 0

      - name: 🔎 Decide what changed
        id: changed
        run: |
          previous=$(git describe --tags --abbrev=0 "v${{ needs.tag.outputs.version }}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            echo "No previous tag: first release, publishing both clients."
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "ts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Assert the HEAD~1 assumption instead of trusting it. Exactly one
          # release commit must sit between the previous tag and HEAD; zero or
          # two both mean the range below is wrong, and two would publish
          # everything. Fail loudly rather than take the dangerous branch.
          releases=$(git log --format=%s "$previous"..HEAD | grep -c '^chore(release):' || true)
          if [ "$releases" -ne 1 ]; then
            echo "::error::Expected exactly one chore(release) commit since $previous, found $releases. The publish gate's diff range is only valid with one; refusing to publish."
            exit 1
          fi
          echo "Comparing $previous..HEAD~1 (HEAD is the release commit)."
          changed=$(git diff --name-only "$previous" HEAD~1)
          echo "$changed"
          if echo "$changed" | grep -q '^clients/python/'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "reef-cli changed: will publish."
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "reef-cli unchanged: SKIPPING publish."
          fi
          if echo "$changed" | grep -q '^clients/ts/'; then
            echo "ts=true" >> "$GITHUB_OUTPUT"
            echo "@haai/reef-cli changed: will publish."
          else
            echo "ts=false" >> "$GITHUB_OUTPUT"
            echo "@haai/reef-cli unchanged: SKIPPING publish."
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.python == 'true'
      - name: 🐍 Publish reef-cli to PyPI
        if: steps.changed.outputs.python == 'true'
        run: |
          uv build --package reef-cli
          uv publish   # trusted publishing; no token in the repo

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.ts == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 🔨 Build @haai/reef-cli
        if: steps.changed.outputs.ts == 'true'
        working-directory: clients/ts
        run: |
          npm ci
          npm run build
          test -f dist/index.js  # refuse to publish what the build did not produce
      - name: 📦 Publish @haai/reef-cli to npm
        if: steps.changed.outputs.ts == 'true'
        working-directory: clients/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
