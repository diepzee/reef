<!-- Source for site/og-card.png, the 1200x630 card every share of reefwith.me
     renders. Kept outside site/ so it is not itself served and indexed.

     To re-render after editing (needs Playwright's cached Chromium):

       python3 -m http.server 8931 --directory . &
       ~/Library/Caches/ms-playwright/chromium_headless_shell-*/\
         chrome-headless-shell-mac-arm64/chrome-headless-shell \
         --headless --disable-gpu --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1200,630 \
         --screenshot=site/og-card.png http://127.0.0.1:8931/scripts/og-card.html

     The og:image:width and og:image:height meta tags in site/*.html and in
     rif.releasenotes._PAGE state 1200x630; changing the size means changing
     those too. -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face {
  font-family: "Nunito"; src: url("../site/nunito-latin.woff2") format("woff2");
  font-weight: 200 1000; font-style: normal;
}
* { box-sizing: border-box; margin: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  font-family: "Nunito", sans-serif; color: #e2f1f5;
  background:
    radial-gradient(ellipse 46% 60% at 88% 18%, rgb(56 189 216 / 0.20), transparent 70%),
    radial-gradient(ellipse 44% 56% at 6% 88%, rgb(45 212 191 / 0.16), transparent 72%),
    radial-gradient(120% 90% at 78% -12%, #0e3140, #0a1b23 46%, #081217);
}
.card { width: 100%; height: 100%; padding: 72px 80px;
  display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px;
  font-size: 34px; font-weight: 800; color: #38bdd8; letter-spacing: -0.01em; }
h1 { font-size: 78px; font-weight: 800; line-height: 1.06;
  letter-spacing: -0.028em; max-width: 13ch; }
h1 .soft { color: #7ce3d3; }
p { margin-top: 26px; font-size: 30px; line-height: 1.45;
  color: #a8c8d2; max-width: 34ch; font-weight: 500; }
.foot { display: flex; align-items: center; gap: 18px;
  font-size: 24px; font-weight: 600; color: #8fb0ba; }
.foot .dot { color: #38bdd8; }
.foot .url { color: #e2f1f5; font-weight: 800; }
.mark { position: absolute; right: 4px; bottom: -18px;
  width: 470px; opacity: 0.42; }
</style></head>
